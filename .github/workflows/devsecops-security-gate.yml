# GitHub Actions Workflow: DevSecOps Security Gate

name: DevSecOps Security Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Gitleaks Secret Detection
      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Trivy Vulnerability Scanner (Filesystem Scan)
      - name: Run Trivy vulnerability scanner in IaC mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1' # Fail on issues
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 3. Checkov IaC Policy-as-Code Scan
      - name: Run Checkov scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./terraform
          framework: terraform
          output_format: cli
          soft_fail: false # Fail the build on any failed check

      # 4. OPA/Rego Policy Test against Terraform IaC
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Plan and Convert to JSON
        run: |
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json
        working-directory: ./terraform

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2

      - name: Run OPA test
        run: |
          opa eval --fail --input terraform/tfplan.json --data policies/opa/s3_kms_enforcement.rego 'data.terraform.analysis.deny'

  local-deployment:
    name: Local Deployment to Floci
    runs-on: ubuntu-latest
    needs: security-scans # This job runs only if security-scans succeeds

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        # Healthcheck to ensure Floci is ready before tests run
        options: --health-cmd="awslocal s3 ls" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials for Floci
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: test
          aws-secret-access-key: test
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform
        env:
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform
        env:
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566
