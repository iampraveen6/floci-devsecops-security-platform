# GitHub Actions Workflow: DevSecOps Security Gate
#
# Phase 1:
#   1. Gitleaks secret detection
#   2. Trivy IaC misconfiguration scan
#   3. Checkov Terraform policy scan
#   4. Terraform init / validate / plan
#   5. OPA/Rego policy evaluation
#   6. Floci local AWS emulation
#   7. Terraform apply against Floci
#
# Container scanning and Slack notification will be added
# only after this baseline pipeline is green.

name: DevSecOps Security Gate

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

# Minimum permissions required by this workflow.
permissions:
  contents: read
  security-events: write
  pull-requests: read

# Prevent multiple runs for the same PR/branch from piling up.
concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # JOB 1: SECURITY SCANS
  # ============================================================
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Environment
      # ----------------------------------------------------------
      - name: Check environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DevSecOps Security Gate"
          echo "Environment"
          echo "=========================================="

          echo ""
          echo "Runner:"
          uname -a

          echo ""
          echo "Git:"
          git --version

          echo ""
          echo "Docker:"
          docker --version

          echo ""
          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "Branch / Ref:"
          echo "${GITHUB_REF}"

      # ==========================================================
      # 1. GITLEAKS
      # ==========================================================
      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # 2. TRIVY IaC
      # ==========================================================
      #
      # IMPORTANT:
      # `ignore-unfixed` is passed to the GitHub Action.
      #
      # Do NOT convert this into:
      #
      # trivy config . --ignore-unfixed
      #
      # because the current Trivy config scanner does not accept
      # that CLI flag.
      #
      # ==========================================================
      - name: Run Trivy vulnerability scanner in IaC mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # ==========================================================
      # 3. CHECKOV
      # ==========================================================
      - name: Run Checkov Terraform scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./terraform
          framework: terraform
          output_format: cli
          soft_fail: false

      # ==========================================================
      # 4. TERRAFORM
      # ==========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform version
        shell: bash
        run: |
          set -euo pipefail
          terraform version

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Init"
          echo "=========================================="

          terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Validate"
          echo "=========================================="

          terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Plan"
          echo "=========================================="

          terraform plan -out=tfplan.binary

      - name: Convert Terraform plan to JSON
        working-directory: ./terraform
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Plan JSON"
          echo "=========================================="

          terraform show -json tfplan.binary > tfplan.json

          test -s tfplan.json

          echo "Terraform plan JSON generated successfully."

      # ==========================================================
      # 5. OPA / REGO
      # ==========================================================
      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2

      - name: OPA version
        shell: bash
        run: |
          set -euo pipefail
          opa version

      - name: Validate OPA policy files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OPA Policy Validation"
          echo "=========================================="

          test -f policies/opa/s3_kms_enforcement.rego

          opa check policies/opa/s3_kms_enforcement.rego

      - name: Run OPA Terraform policy
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OPA Terraform Policy"
          echo "=========================================="

          test -f tfplan.json

          opa eval \
            --fail \
            --input tfplan.json \
            --data ../policies/opa/s3_kms_enforcement.rego \
            'data.terraform.analysis.deny'

      # ==========================================================
      # SECURITY GATE SUMMARY
      # ==========================================================
      - name: Security gate passed
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "SECURITY GATE PASSED"
          echo "=========================================="
          echo ""
          echo "Gitleaks       : PASSED"
          echo "Trivy IaC      : PASSED"
          echo "Checkov        : PASSED"
          echo "Terraform      : PASSED"
          echo "OPA/Rego       : PASSED"
          echo ""
          echo "Proceeding to Floci deployment."
          echo ""


  # ============================================================
  # JOB 2: LOCAL DEPLOYMENT TO FLOCI
  # ============================================================
  local-deployment:
    name: Local Deployment to Floci
    runs-on: ubuntu-latest

    needs:
      - security-scans

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Environment
      # ----------------------------------------------------------
      - name: Check deployment environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Floci Deployment Environment"
          echo "=========================================="

          echo ""
          echo "Docker:"
          docker --version

      # ----------------------------------------------------------
      # Wait for Floci
      # ----------------------------------------------------------
      - name: Wait for Floci
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Waiting for Floci"
          echo "=========================================="

          for i in {1..30}; do

            if curl --fail --silent --show-error \
              http://127.0.0.1:4566/_localstack/health \
              > /dev/null 2>&1; then

              echo "Floci is ready."
              exit 0

            fi

            echo "Waiting for Floci... attempt ${i}/30"
            sleep 2

          done

          echo "Floci did not become ready."

          docker ps -a

          exit 1

      # ----------------------------------------------------------
      # Verify Floci endpoint
      # ----------------------------------------------------------
      - name: Check Floci endpoint
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Floci Endpoint"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:4566/ \
            || true

      # ----------------------------------------------------------
      # Terraform
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform version
        shell: bash
        run: |
          set -euo pipefail
          terraform version

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------
      - name: Terraform Init
        working-directory: ./terraform
        env:
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_KMS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_IAM: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_STS: http://127.0.0.1:4566
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Init - Floci"
          echo "=========================================="

          terraform init

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------
      - name: Terraform Validate
        working-directory: ./terraform
        env:
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_KMS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_IAM: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_STS: http://127.0.0.1:4566
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Validate - Floci"
          echo "=========================================="

          terraform validate

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------
      - name: Terraform Apply
        working-directory: ./terraform
        env:
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_KMS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_IAM: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_STS: http://127.0.0.1:4566
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Apply - Floci"
          echo "=========================================="

          terraform apply -auto-approve

      # ----------------------------------------------------------
      # Deployment verification
      # ----------------------------------------------------------
      - name: Verify Terraform state
        working-directory: ./terraform
        env:
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_KMS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_IAM: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_STS: http://127.0.0.1:4566
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform State"
          echo "=========================================="

          terraform state list || true

      # ----------------------------------------------------------
      # Deployment success
      # ----------------------------------------------------------
      - name: Deployment passed
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "FLOCI DEPLOYMENT PASSED"
          echo "=========================================="
          echo ""
          echo "Security scans : PASSED"
          echo "Terraform      : PASSED"
          echo "Floci          : READY"
          echo "Terraform Apply: PASSED"
          echo ""