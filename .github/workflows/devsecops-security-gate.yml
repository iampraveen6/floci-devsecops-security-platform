name: DevSecOps Security Gate

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1

  TERRAFORM_VERSION: "1.12.2"
  GITLEAKS_VERSION: "8.24.2"
  TRIVY_VERSION: "0.70.0"
  OPA_VERSION: "1.17.0"

  FLOCI_IMAGE: "floci/floci:latest"


jobs:

  # ============================================================
  # SECURITY SCANS
  # ============================================================

  security-scans:

    name: Security Scans
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT REPOSITORY
      # ========================================================

      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Initializing repository"
          echo "=========================================="

          git init .

          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch \
            --no-tags \
            --depth=1 \
            origin \
            "${GITHUB_SHA}"

          git checkout --force FETCH_HEAD

          git remote remove origin

          echo ""
          echo "Repository checkout completed."

          git rev-parse HEAD


      # ========================================================
      # VERIFY WORKFLOW CONTENT
      # ========================================================

      - name: Verify workflow configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Workflow Configuration Verification"
          echo "=========================================="

          WORKFLOW_FILE=".github/workflows/devsecops-security-gate.yml"

          if [ ! -f "$WORKFLOW_FILE" ]; then
            echo "ERROR: Workflow file not found."
            exit 1
          fi

          echo ""
          echo "Workflow file:"
          echo "$WORKFLOW_FILE"

          echo ""
          echo "Current commit:"
          git rev-parse HEAD

          echo ""
          echo "Trivy references in workflow:"

          grep -n -E "trivy|ignore-unfixed" "$WORKFLOW_FILE" || true

          echo ""
          echo "Checking for invalid --ignore-unfixed usage..."

          if grep -n -B5 -A5 "trivy config" "$WORKFLOW_FILE" | grep -q -- "--ignore-unfixed"; then
            echo ""
            echo "ERROR: --ignore-unfixed is being used with trivy config."
            exit 1
          fi

          echo ""
          echo "Workflow configuration verification passed."


      # ========================================================
      # SYSTEM DEPENDENCIES
      # ========================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing system dependencies"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install \
            --yes \
            curl \
            unzip \
            jq \
            tar \
            gzip


      # ========================================================
      # TERRAFORM
      # ========================================================

      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TERRAFORM_VERSION}"

          echo "=========================================="
          echo "Installing Terraform ${VERSION}"
          echo "=========================================="

          TEMP_DIR="$(mktemp -d)"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip" \
            --output "${TEMP_DIR}/terraform.zip"

          unzip \
            -o \
            "${TEMP_DIR}/terraform.zip" \
            -d "${TEMP_DIR}"

          sudo install \
            -m 0755 \
            "${TEMP_DIR}/terraform" \
            /usr/local/bin/terraform

          terraform version


      # ========================================================
      # GITLEAKS
      # ========================================================

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITLEAKS_VERSION}"

          echo "=========================================="
          echo "Installing Gitleaks ${VERSION}"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz

          tar \
            -xzf \
            /tmp/gitleaks.tar.gz \
            -C /tmp

          sudo install \
            -m 0755 \
            /tmp/gitleaks \
            /usr/local/bin/gitleaks

          gitleaks version


      # ========================================================
      # TRIVY
      # ========================================================

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TRIVY_VERSION}"

          echo "=========================================="
          echo "Installing Trivy ${VERSION}"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            --output /tmp/trivy.tar.gz

          tar \
            -xzf \
            /tmp/trivy.tar.gz \
            -C /tmp

          sudo install \
            -m 0755 \
            /tmp/trivy \
            /usr/local/bin/trivy

          echo ""
          trivy --version


      # ========================================================
      # CHECKOV
      # ========================================================

      - name: Install Checkov
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing Checkov"
          echo "=========================================="

          python3 -m pip install \
            --upgrade \
            pip \
            --break-system-packages

          python3 -m pip install \
            --upgrade \
            checkov \
            --break-system-packages

          checkov --version


      # ========================================================
      # OPA
      # ========================================================

      - name: Install OPA
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${OPA_VERSION}"

          echo "=========================================="
          echo "Installing OPA ${VERSION}"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://openpolicyagent.org/downloads/v${VERSION}/opa_linux_amd64_static" \
            --output /tmp/opa

          sudo install \
            -m 0755 \
            /tmp/opa \
            /usr/local/bin/opa

          opa version


      # ========================================================
      # ENVIRONMENT
      # ========================================================

      - name: Check environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Environment"
          echo "=========================================="

          echo ""
          echo "Runner:"
          uname -a

          echo ""
          echo "Git:"
          git --version

          echo ""
          echo "Docker:"
          docker --version

          echo ""
          echo "Terraform:"
          terraform version

          echo ""
          echo "Gitleaks:"
          gitleaks version

          echo ""
          echo "Trivy:"
          trivy --version

          echo ""
          echo "Checkov:"
          checkov --version

          echo ""
          echo "OPA:"
          opa version


      # ========================================================
      # GITLEAKS
      # ========================================================

      - name: Run Gitleaks secret detection
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Gitleaks Secret Detection"
          echo "=========================================="

          gitleaks git \
            --redact \
            --verbose


      # ========================================================
      # TRIVY IaC
      #
      # IMPORTANT:
      # DO NOT USE --ignore-unfixed HERE.
      # ========================================================

      - name: Run Trivy IaC scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Trivy IaC Security Scan"
          echo "=========================================="

          echo "Trivy version:"
          trivy --version

          echo ""
          echo "Running:"
          echo "trivy config --severity HIGH,CRITICAL --exit-code 1 --format table ."

          echo ""
          echo "Scanning Terraform and configuration files..."

          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            .


      # ========================================================
      # CHECKOV
      # ========================================================

      - name: Run Checkov Terraform scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checkov Terraform Security Scan"
          echo "=========================================="

          checkov \
            --directory ./terraform \
            --framework terraform \
            --output cli \
            --soft-fail false


      # ========================================================
      # TERRAFORM INIT
      # ========================================================

      - name: Terraform Init
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Init"
          echo "=========================================="

          terraform init \
            -input=false


      # ========================================================
      # TERRAFORM VALIDATE
      # ========================================================

      - name: Terraform Validate
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Validate"
          echo "=========================================="

          terraform validate


      # ========================================================
      # TERRAFORM PLAN
      # ========================================================

      - name: Terraform Plan
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Plan"
          echo "=========================================="

          terraform plan \
            -input=false \
            -out=tfplan.binary

          terraform show \
            -json \
            tfplan.binary \
            > tfplan.json


      # ========================================================
      # OPA VALIDATION
      # ========================================================

      - name: Validate OPA policies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OPA Policy Validation"
          echo "=========================================="

          opa check \
            policies/opa


      # ========================================================
      # OPA TERRAFORM POLICY
      # ========================================================

      - name: Run OPA Terraform policy
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OPA Terraform Policy"
          echo "=========================================="

          opa eval \
            --fail \
            --input terraform/tfplan.json \
            --data policies/opa/s3_kms_enforcement.rego \
            'data.terraform.analysis.deny'


      # ========================================================
      # BUILD APPLICATION
      # ========================================================

      - name: Build sample application
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building sample application"
          echo "=========================================="

          docker build \
            --tag sample-app:latest \
            ./app

          docker images sample-app:latest


      # ========================================================
      # TRIVY IMAGE
      #
      # --ignore-unfixed IS VALID HERE.
      # ========================================================

      - name: Run Trivy container vulnerability scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Trivy Container Vulnerability Scan"
          echo "=========================================="

          echo "Running image vulnerability scan..."

          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            sample-app:latest


  # ============================================================
  # FLOCI LOCAL DEPLOYMENT
  # ============================================================

  local-deployment:

    name: Local Deployment to Floci

    runs-on: ubuntu-latest

    needs:
      - security-scans

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Initializing repository"
          echo "=========================================="

          git init .

          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch \
            --no-tags \
            --depth=1 \
            origin \
            "${GITHUB_SHA}"

          git checkout \
            --force \
            FETCH_HEAD

          git remote remove origin

          git rev-parse HEAD


      # ========================================================
      # DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install \
            --yes \
            curl \
            unzip \
            jq \
            tar \
            gzip


      # ========================================================
      # TERRAFORM
      # ========================================================

      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TERRAFORM_VERSION}"

          TEMP_DIR="$(mktemp -d)"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip" \
            --output "${TEMP_DIR}/terraform.zip"

          unzip \
            -o \
            "${TEMP_DIR}/terraform.zip" \
            -d "${TEMP_DIR}"

          sudo install \
            -m 0755 \
            "${TEMP_DIR}/terraform" \
            /usr/local/bin/terraform

          terraform version


      # ========================================================
      # DOCKER
      # ========================================================

      - name: Check Docker
        shell: bash
        run: |
          set -euo pipefail

          docker version


      # ========================================================
      # FLOCI
      # ========================================================

      - name: Pull Floci
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Pulling Floci"
          echo "=========================================="

          for attempt in 1 2 3 4 5; do

            echo "Pull attempt ${attempt}/5"

            if docker pull "${FLOCI_IMAGE}"; then
              exit 0
            fi

            sleep $((attempt * 5))

          done

          echo "Failed to pull Floci."

          exit 1


      # ========================================================
      # START FLOCI
      # ========================================================

      - name: Start Floci
        shell: bash
        run: |
          set -euo pipefail

          docker rm \
            --force \
            floci 2>/dev/null || true

          docker run \
            --detach \
            --name floci \
            --publish 4566:4566 \
            "${FLOCI_IMAGE}"

          docker ps -a


      # ========================================================
      # FLOCI HEALTH CHECK
      # ========================================================

      - name: Wait for Floci
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Waiting for Floci"
          echo "=========================================="

          for attempt in {1..30}; do

            echo "Health check ${attempt}/30"

            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 5 \
              http://localhost:4566/ \
              >/dev/null 2>&1; then

              echo "Floci is ready."

              exit 0

            fi

            sleep 2

          done

          echo "ERROR: Floci did not become ready."

          docker ps -a

          echo ""
          echo "Floci logs:"

          docker logs floci || true

          exit 1


      # ========================================================
      # TERRAFORM INIT
      # ========================================================

      - name: Terraform Init
        working-directory: ./terraform
        env:
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -input=false


      # ========================================================
      # TERRAFORM VALIDATE
      # ========================================================

      - name: Terraform Validate
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform validate


      # ========================================================
      # TERRAFORM APPLY
      # ========================================================

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Apply"
          echo "=========================================="

          terraform apply \
            -input=false \
            -auto-approve


      # ========================================================
      # FLOCI DIAGNOSTICS
      # ========================================================

      - name: Floci diagnostics
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "Floci Diagnostics"
          echo "=========================================="

          docker ps -a || true

          echo ""
          echo "Floci logs:"

          docker logs floci 2>&1 || true


  # ============================================================
  # FAILURE NOTIFICATION
  # ============================================================

  notify-on-failure:

    name: Slack Failure Notification

    runs-on: ubuntu-latest

    needs:
      - security-scans
      - local-deployment

    if: >-
      always() &&
      (
        needs.security-scans.result == 'failure' ||
        needs.local-deployment.result == 'failure'
      )

    steps:

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured."
            exit 0
          fi

          MESSAGE="DevSecOps Security Gate failed
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(jq \
            -n \
            --arg text "$MESSAGE" \
            '{text: $text}')

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${SLACK_WEBHOOK_URL}"