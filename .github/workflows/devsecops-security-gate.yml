name: DevSecOps Security Gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  TF_WORKING_DIR: ./terraform
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:

  # ============================================================
  # JOB 1 - SECURITY SCANNING
  # ============================================================
  security-scans:
    name: DevSecOps Security Scans
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Environment
      # --------------------------------------------------------
      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Environment"
          echo "=========================================="

          echo "Runner:"
          uname -a

          echo
          echo "Git:"
          git --version

          echo
          echo "Docker:"
          docker --version

          echo
          echo "Repository:"
          pwd

          echo
          echo "Files:"
          ls -la

      # ========================================================
      # GITLEAKS
      # ========================================================
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          GITLEAKS_VERSION="8.28.0"

          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

          gitleaks version

      - name: Run Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Gitleaks Secret Detection"
          echo "=========================================="

          gitleaks detect \
            --source . \
            --redact \
            --verbose

      # ========================================================
      # TRIVY
      # ========================================================
      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail

          TRIVY_VERSION="0.65.0"

          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz

          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy

          sudo install /tmp/trivy /usr/local/bin/trivy

          trivy --version

      - name: Run Trivy IaC scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Trivy IaC Security Scan"
          echo "=========================================="

          echo "Scanning Terraform and configuration files..."

          trivy config . \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --skip-dirs .git \
            --skip-dirs .terraform

      # ========================================================
      # CHECKOV
      # ========================================================
      - name: Install Checkov
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install checkov

          checkov --version

      - name: Run Checkov
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checkov Terraform Security Scan"
          echo "=========================================="

          if [ ! -d "${TF_WORKING_DIR}" ]; then
            echo "Terraform directory not found."
            exit 1
          fi

          checkov \
            --directory "${TF_WORKING_DIR}" \
            --framework terraform \
            --output cli \
            --compact

      # ========================================================
      # TERRAFORM
      # ========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform version
        shell: bash
        run: |
          set -euo pipefail
          terraform version

      - name: Terraform format check
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -input=false \
            -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform validate

      # ========================================================
      # OPA
      # ========================================================
      - name: Install OPA
        shell: bash
        run: |
          set -euo pipefail

          OPA_VERSION="1.6.0"

          curl -fsSL \
            -o /tmp/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"

          sudo install -m 0755 /tmp/opa /usr/local/bin/opa

          opa version

      - name: Validate OPA policies
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "policies/opa" ]; then
            echo "OPA policy directory not found."
            exit 1
          fi

          opa check policies/opa

      # ========================================================
      # TERRAFORM PLAN
      # ========================================================
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -out=tfplan.binary

          terraform show \
            -json \
            tfplan.binary > tfplan.json

      - name: Run OPA Terraform policy
        shell: bash
        run: |
          set -euo pipefail

          POLICY="policies/opa/s3_kms_enforcement.rego"

          if [ ! -f "${POLICY}" ]; then
            echo "OPA policy not found: ${POLICY}"
            exit 1
          fi

          if [ ! -f "${TF_WORKING_DIR}/tfplan.json" ]; then
            echo "Terraform plan JSON not found."
            exit 1
          fi

          opa eval \
            --fail-defined \
            --input "${TF_WORKING_DIR}/tfplan.json" \
            --data "${POLICY}" \
            "data.terraform.analysis.deny"

      # ========================================================
      # DOCKER BUILD
      # ========================================================
      - name: Build application image
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Docker Build"
          echo "=========================================="

          if [ ! -f "Dockerfile" ]; then
            echo "Dockerfile not found."
            echo "Skipping Docker build because this repository does not contain a root Dockerfile."
            exit 0
          fi

          docker build \
            --tag floci-devsecops-security-platform:security-test \
            .

      # ========================================================
      # TRIVY CONTAINER SCAN
      # ========================================================
      - name: Run Trivy container scan
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          if ! docker image inspect floci-devsecops-security-platform:security-test >/dev/null 2>&1; then
            echo "No locally built application image found."
            echo "Skipping container scan."
            exit 0
          fi

          echo "=========================================="
          echo "Trivy Container Vulnerability Scan"
          echo "=========================================="

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            floci-devsecops-security-platform:security-test


  # ============================================================
  # JOB 2 - LOCAL FLOCI DEPLOYMENT
  # ============================================================
  local-deployment:
    name: Floci Local Deployment
    runs-on: ubuntu-latest

    needs:
      - security-scans

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform version
        run: terraform version

      # --------------------------------------------------------
      # Wait for Floci
      # --------------------------------------------------------
      - name: Wait for Floci
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Floci..."

          for i in {1..30}; do
            if curl -fsS http://localhost:4566/_localstack/health >/dev/null 2>&1; then
              echo "Floci is ready."
              exit 0
            fi

            echo "Waiting..."
            sleep 2
          done

          echo "Floci did not become ready."
          exit 1

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566
        run: |
          set -euo pipefail

          terraform init \
            -input=false \
            -backend=false

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------
      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------
      - name: Terraform apply to Floci
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566
        run: |
          set -euo pipefail

          terraform apply \
            -input=false \
            -auto-approve

      # --------------------------------------------------------
      # Verify Deployment
      # --------------------------------------------------------
      - name: Verify Floci deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Floci Verification"
          echo "=========================================="

          curl -fsS \
            http://localhost:4566/_localstack/health

          echo
          echo "Floci deployment verification completed."


  # ============================================================
  # JOB 3 - ROLLBACK
  # ============================================================
  rollback:
    name: Rollback Floci Deployment
    runs-on: ubuntu-latest

    needs:
      - local-deployment

    if: failure()

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Wait for Floci
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if curl -fsS http://localhost:4566/_localstack/health >/dev/null 2>&1; then
              echo "Floci is ready."
              exit 0
            fi

            sleep 2
          done

          echo "Floci is not available."
          exit 1

      - name: Terraform init for rollback
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566
        run: |
          set -euo pipefail

          terraform init \
            -input=false \
            -backend=false

      - name: Terraform rollback destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ROLLBACK"
          echo "=========================================="

          terraform destroy \
            -input=false \
            -auto-approve

          echo "Rollback completed."


  # ============================================================
  # JOB 4 - ROLLBACK ON SECURITY FAILURE
  # ============================================================
  security-failure-notice:
    name: Security Gate Failed
    runs-on: ubuntu-latest

    needs:
      - security-scans

    if: failure()

    steps:
      - name: Security gate failure
        shell: bash
        run: |
          echo "=========================================="
          echo "SECURITY GATE FAILED"
          echo "=========================================="
          echo
          echo "One or more security checks failed."
          echo
          echo "Deployment was blocked."
          echo
          echo "Review:"
          echo "  - Gitleaks"
          echo "  - Trivy IaC"
          echo "  - Checkov"
          echo "  - Terraform validation"
          echo "  - OPA policies"
          echo "  - Trivy container scan"
          echo
          echo "No production deployment should proceed."