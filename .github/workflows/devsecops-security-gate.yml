```yaml
name: DevSecOps Security Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Default permissions are intentionally restrictive.
permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:

  # ============================================================
  # JOB 1 - SECURITY SCANNING
  # ============================================================
  security-scans:
    name: DevSecOps Security Scans
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Environment
      # --------------------------------------------------------
      - name: Check environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Environment"
          echo "=========================================="

          echo "Runner:"
          uname -a

          echo
          echo "Git:"
          git --version

          echo
          echo "Docker:"
          docker --version

          echo
          echo "Repository:"
          pwd

          echo
          echo "Terraform files:"
          find terraform -maxdepth 2 -type f 2>/dev/null || true

      # ========================================================
      # GITLEAKS
      # ========================================================
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          GITLEAKS_VERSION="8.24.2"

          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

          gitleaks version

      - name: Run Gitleaks secret detection
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Gitleaks Secret Detection"
          echo "=========================================="

          gitleaks detect \
            --source . \
            --redact \
            --verbose

      # ========================================================
      # TRIVY
      # ========================================================
      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail

          TRIVY_VERSION="0.69.3"

          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz

          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy

          sudo install /tmp/trivy /usr/local/bin/trivy

          trivy --version

      - name: Run Trivy IaC security scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Trivy IaC Security Scan"
          echo "=========================================="

          echo "Scanning Terraform, Dockerfiles, Kubernetes and configuration files."

          trivy config . \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --skip-dirs .git \
            --skip-dirs node_modules

      # ========================================================
      # CHECKOV
      # ========================================================
      - name: Install Checkov
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install checkov

          checkov --version

      - name: Run Checkov Terraform scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checkov Terraform Security Scan"
          echo "=========================================="

          checkov \
            --directory ./terraform \
            --framework terraform \
            --output cli \
            --soft-fail false

      # ========================================================
      # TERRAFORM
      # ========================================================
      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail

          TERRAFORM_VERSION="1.12.2"

          sudo apt-get update
          sudo apt-get install -y unzip

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            -o /tmp/terraform.zip

          unzip -o /tmp/terraform.zip -d /tmp/terraform

          sudo install /tmp/terraform/terraform /usr/local/bin/terraform

          terraform version

      - name: Terraform Init
        shell: bash
        working-directory: ./terraform
        run: |
          set -euo pipefail

          terraform init \
            -backend=false

      - name: Terraform Format Check
        shell: bash
        working-directory: ./terraform
        run: |
          set -euo pipefail

          terraform fmt \
            -check \
            -recursive

      - name: Terraform Validate
        shell: bash
        working-directory: ./terraform
        run: |
          set -euo pipefail

          terraform validate

      - name: Terraform Plan
        shell: bash
        working-directory: ./terraform
        run: |
          set -euo pipefail

          terraform plan \
            -out=tfplan.binary

          terraform show \
            -json \
            tfplan.binary > tfplan.json

      # ========================================================
      # OPA
      # ========================================================
      - name: Install OPA
        shell: bash
        run: |
          set -euo pipefail

          OPA_VERSION="1.7.1"

          curl -fsSL \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static" \
            -o /tmp/opa

          chmod +x /tmp/opa

          sudo install /tmp/opa /usr/local/bin/opa

          opa version

      - name: Validate OPA policies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OPA Policy Validation"
          echo "=========================================="

          if [ -d "policies/opa" ]; then
            opa check policies/opa
          else
            echo "No OPA policy directory found."
            exit 1
          fi

      - name: Run OPA Terraform policy
        shell: bash
        run: |
          set -euo pipefail

          POLICY="policies/opa/s3_kms_enforcement.rego"
          PLAN="terraform/tfplan.json"

          if [ ! -f "$POLICY" ]; then
            echo "OPA policy not found: $POLICY"
            exit 1
          fi

          if [ ! -f "$PLAN" ]; then
            echo "Terraform plan JSON not found: $PLAN"
            exit 1
          fi

          echo "=========================================="
          echo "OPA Terraform Security Policy"
          echo "=========================================="

          opa eval \
            --fail-defined \
            --input "$PLAN" \
            --data "$POLICY" \
            'data.terraform.analysis.deny'

      # ========================================================
      # BUILD SAMPLE APPLICATION
      # ========================================================
      - name: Build sample application
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Application Build"
          echo "=========================================="

          if [ -f "Dockerfile" ]; then
            docker build \
              --tag floci-devsecops-security-platform:test \
              .
          elif [ -f "docker-compose.yml" ]; then
            docker compose build
          else
            echo "No Dockerfile or docker-compose.yml found."
            echo "Skipping application image build."
          fi

      # ========================================================
      # TRIVY CONTAINER SCAN
      # ========================================================
      - name: Run Trivy container vulnerability scan
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="floci-devsecops-security-platform:test"

          if docker image inspect "$IMAGE" >/dev/null 2>&1; then

            echo "=========================================="
            echo "Trivy Container Vulnerability Scan"
            echo "=========================================="

            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format table \
              "$IMAGE"

          else
            echo "Image $IMAGE was not built."
            echo "Skipping container scan."
          fi

  # ============================================================
  # JOB 2 - LOCAL FLOCI DEPLOYMENT
  # ============================================================
  local-deployment:
    name: Local Floci Terraform Deployment
    runs-on: ubuntu-latest

    needs:
      - security-scans

    permissions:
      contents: read

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------------
      # Install Terraform
      # --------------------------------------------------------
      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail

          TERRAFORM_VERSION="1.12.2"

          sudo apt-get update
          sudo apt-get install -y unzip

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            -o /tmp/terraform.zip

          unzip -o /tmp/terraform.zip -d /tmp/terraform

          sudo install /tmp/terraform/terraform /usr/local/bin/terraform

          terraform version

      # --------------------------------------------------------
      # Wait for Floci
      # --------------------------------------------------------
      - name: Wait for Floci
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Floci on port 4566..."

          for i in {1..60}; do

            if curl -fsS \
              "http://127.0.0.1:4566/_localstack/health" \
              >/dev/null 2>&1; then

              echo "Floci is ready."
              exit 0
            fi

            sleep 2

          done

          echo "Floci did not become ready."
          exit 1

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: ./terraform
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

        run: |
          set -euo pipefail

          terraform init \
            -backend=false

      # --------------------------------------------------------
      # Terraform Apply to Floci
      # --------------------------------------------------------
      - name: Terraform Apply
        working-directory: ./terraform
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_KMS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_IAM: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_STS: http://127.0.0.1:4566

        run: |
          set -euo pipefail

          terraform apply \
            -auto-approve

      # --------------------------------------------------------
      # Deployment Verification
      # --------------------------------------------------------
      - name: Verify Terraform deployment
        working-directory: ./terraform
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_KMS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_IAM: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_STS: http://127.0.0.1:4566

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Deployment Verification"
          echo "=========================================="

          terraform state list || true

      # --------------------------------------------------------
      # Rollback
      # --------------------------------------------------------
      - name: Rollback Floci deployment
        if: failure()
        working-directory: ./terraform
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_KMS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_IAM: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_STS: http://127.0.0.1:4566

        run: |
          set -u

          echo "=========================================="
          echo "ROLLBACK"
          echo "=========================================="

          if [ -f terraform.tfstate ] || [ -f terraform.tfstate.backup ]; then

            echo "Terraform state found."
            echo "Destroying resources created in Floci..."

            terraform destroy \
              -auto-approve || true

          else

            echo "No Terraform state found."
            echo "Nothing to rollback."

          fi

      # --------------------------------------------------------
      # Rollback verification
      # --------------------------------------------------------
      - name: Verify rollback
        if: failure()
        shell: bash
        run: |
          set -u

          echo "=========================================="
          echo "Rollback Verification"
          echo "=========================================="

          echo "Floci container/service remains isolated to this CI runner."
          echo "Rollback attempted using Terraform destroy."
