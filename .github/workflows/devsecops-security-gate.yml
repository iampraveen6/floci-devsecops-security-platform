name: DevSecOps Security Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:

  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Environment"
          echo "=========================================="

          echo "Runner:"
          uname -a

          echo
          echo "Git:"
          git --version

          echo
          echo "Docker:"
          docker --version

          echo
          echo "Repository:"
          pwd

          echo
          echo "Terraform directory:"
          ls -la terraform || true

      # ========================================================
      # GITLEAKS
      # ========================================================

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          VERSION="8.24.2"

          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

          gitleaks version

      - name: Run Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Gitleaks Secret Detection"
          echo "=========================================="

          gitleaks detect \
            --source . \
            --redact \
            --verbose

      # ========================================================
      # TRIVY
      # ========================================================

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.69.3"

          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz

          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy

          sudo install /tmp/trivy /usr/local/bin/trivy

          trivy --version

      - name: Run Trivy IaC scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Trivy IaC Security Scan"
          echo "=========================================="

          trivy config . \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --skip-dirs .git \
            --skip-dirs node_modules

      # ========================================================
      # CHECKOV
      # ========================================================

      - name: Install Checkov
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install checkov

          checkov --version

      - name: Run Checkov
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checkov Terraform Scan"
          echo "=========================================="

          checkov \
            --directory ./terraform \
            --framework terraform \
            --output cli

      # ========================================================
      # TERRAFORM
      # ========================================================

      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.12.2"

          sudo apt-get update
          sudo apt-get install -y unzip

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip" \
            -o /tmp/terraform.zip

          mkdir -p /tmp/terraform

          unzip -o /tmp/terraform.zip -d /tmp/terraform

          sudo install \
            /tmp/terraform/terraform \
            /usr/local/bin/terraform

          terraform version

      - name: Terraform Init
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -backend=false

      - name: Terraform Format Check
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform fmt \
            -check \
            -recursive

      - name: Terraform Validate
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -out=tfplan.binary

          terraform show \
            -json \
            tfplan.binary \
            > tfplan.json

      # ========================================================
      # OPA
      # ========================================================

      - name: Install OPA
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.7.1"

          curl -fsSL \
            "https://openpolicyagent.org/downloads/v${VERSION}/opa_linux_amd64_static" \
            -o /tmp/opa

          chmod +x /tmp/opa

          sudo install /tmp/opa /usr/local/bin/opa

          opa version

      - name: Validate OPA policies
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "policies/opa" ]; then
            echo "ERROR: policies/opa directory not found"
            exit 1
          fi

          opa check policies/opa

      - name: Run OPA Terraform policy
        shell: bash
        run: |
          set -euo pipefail

          POLICY="policies/opa/s3_kms_enforcement.rego"
          PLAN="terraform/tfplan.json"

          if [ ! -f "$POLICY" ]; then
            echo "ERROR: OPA policy not found:"
            echo "$POLICY"
            exit 1
          fi

          if [ ! -f "$PLAN" ]; then
            echo "ERROR: Terraform plan JSON not found:"
            echo "$PLAN"
            exit 1
          fi

          opa eval \
            --fail-defined \
            --input "$PLAN" \
            --data "$POLICY" \
            'data.terraform.analysis.deny'

      # ========================================================
      # DOCKER BUILD
      # ========================================================

      - name: Build application image
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "Dockerfile" ]; then

            docker build \
              -t floci-devsecops-security-platform:test \
              .

          else

            echo "No Dockerfile found."
            echo "Skipping application image build."

          fi

      # ========================================================
      # TRIVY CONTAINER SCAN
      # ========================================================

      - name: Run Trivy container scan
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="floci-devsecops-security-platform:test"

          if docker image inspect "$IMAGE" >/dev/null 2>&1; then

            echo "=========================================="
            echo "Trivy Container Vulnerability Scan"
            echo "=========================================="

            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format table \
              "$IMAGE"

          else

            echo "Container image not found."
            echo "Skipping container vulnerability scan."

          fi

  # ============================================================
  # FLOCI LOCAL DEPLOYMENT
  # ============================================================

  local-deployment:
    name: Floci Local Deployment
    runs-on: ubuntu-latest

    needs:
      - security-scans

    permissions:
      contents: read

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========================================================
      # TERRAFORM
      # ========================================================

      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail

          VERSION="1.12.2"

          sudo apt-get update
          sudo apt-get install -y unzip

          curl -fsSL \
            "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip" \
            -o /tmp/terraform.zip

          mkdir -p /tmp/terraform

          unzip -o /tmp/terraform.zip -d /tmp/terraform

          sudo install \
            /tmp/terraform/terraform \
            /usr/local/bin/terraform

          terraform version

      # ========================================================
      # FLOCI HEALTH CHECK
      # ========================================================

      - name: Wait for Floci
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Floci..."

          for i in {1..60}; do

            if curl -fsS \
              http://127.0.0.1:4566/_localstack/health \
              >/dev/null 2>&1; then

              echo "Floci is ready."
              exit 0

            fi

            sleep 2

          done

          echo "ERROR: Floci did not become ready."
          exit 1

      # ========================================================
      # TERRAFORM INIT
      # ========================================================

      - name: Terraform Init
        working-directory: ./terraform
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail

          terraform init \
            -backend=false

      # ========================================================
      # TERRAFORM APPLY
      # ========================================================

      - name: Terraform Apply to Floci
        working-directory: ./terraform
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_KMS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_IAM: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_STS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://127.0.0.1:4566

        run: |
          set -euo pipefail

          terraform apply \
            -auto-approve

      # ========================================================
      # VERIFY
      # ========================================================

      - name: Verify deployment
        working-directory: ./terraform
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_KMS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_IAM: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_STS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://127.0.0.1:4566

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform State"
          echo "=========================================="

          terraform state list

      # ========================================================
      # ROLLBACK
      # ========================================================

      - name: Rollback deployment
        if: ${{ failure() }}
        working-directory: ./terraform
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_S3: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_KMS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_IAM: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_STS: http://127.0.0.1:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://127.0.0.1:4566

        run: |
          set +e

          echo "=========================================="
          echo "ROLLBACK"
          echo "=========================================="

          if [ -f terraform.tfstate ]; then

            terraform destroy \
              -auto-approve

          else

            echo "No Terraform state found."
            echo "Nothing to rollback."

          fi