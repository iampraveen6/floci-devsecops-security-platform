# ============================================================
# DevSecOps Security Gate
# ============================================================

name: DevSecOps Security Gate

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

# ============================================================
# Permissions
# ============================================================

permissions:
  contents: read

# ============================================================
# Global Environment
# ============================================================

env:
  TF_IN_AUTOMATION: "true"

  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1

  TERRAFORM_VERSION: "1.12.2"
  GITLEAKS_VERSION: "8.24.2"
  TRIVY_VERSION: "0.70.0"
  OPA_VERSION: "1.17.0"

  FLOCI_IMAGE: "floci/floci@sha256:d2ecc8035822b23b8587a56eab15edd825f41d3fb80d93e8e66680410beddc08"


# ============================================================
# JOBS
# ============================================================

jobs:

  # ============================================================
  # SECURITY SCANS
  # ============================================================

  security-scans:

    name: Security Scans
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Initializing repository"
          echo "=========================================="

          git init .

          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          echo "Fetching repository..."

          git fetch \
            --no-tags \
            --prune \
            origin \
            "+refs/heads/*:refs/remotes/origin/*"

          echo "Checking out ${GITHUB_SHA}"

          git checkout \
            --force \
            "${GITHUB_SHA}"

          git remote remove origin

          echo ""
          echo "Repository checkout completed."

          git rev-parse HEAD


      # ========================================================
      # INSTALL UNZIP
      # ========================================================

      - name: Install required system packages
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing system dependencies"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install \
            --yes \
            unzip \
            curl \
            jq


      # ========================================================
      # INSTALL TERRAFORM
      # ========================================================

      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TERRAFORM_VERSION}"

          echo "=========================================="
          echo "Installing Terraform ${VERSION}"
          echo "=========================================="

          WORK_DIR="$(mktemp -d)"

          echo "Downloading Terraform..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip" \
            --output "${WORK_DIR}/terraform.zip"

          echo "Extracting Terraform..."

          unzip \
            -o \
            "${WORK_DIR}/terraform.zip" \
            -d "${WORK_DIR}"

          echo "Installing Terraform to /usr/local/bin..."

          sudo install \
            -m 0755 \
            "${WORK_DIR}/terraform" \
            /usr/local/bin/terraform

          echo ""
          echo "Checking installed Terraform binary..."

          ls -la /usr/local/bin/terraform

          echo ""
          echo "PATH:"
          echo "${PATH}"

          echo ""
          echo "Terraform location:"
          command -v terraform

          echo ""
          echo "Terraform version:"
          /usr/local/bin/terraform version

          echo ""
          echo "Terraform installation successful."


      # ========================================================
      # VERIFY TERRAFORM
      # ========================================================

      - name: Verify Terraform
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Verification"
          echo "=========================================="

          if [ ! -x /usr/local/bin/terraform ]; then
            echo "ERROR: Terraform binary does not exist."
            exit 1
          fi

          export PATH="/usr/local/bin:${PATH}"

          echo "Terraform binary:"
          command -v terraform

          echo ""
          echo "Terraform version:"
          terraform version


      # ========================================================
      # ENVIRONMENT CHECK
      # ========================================================

      - name: Check environment
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/local/bin:${PATH}"

          echo "=========================================="
          echo "Environment"
          echo "=========================================="

          echo ""
          echo "Runner:"
          uname -a

          echo ""
          echo "Git:"
          git --version

          echo ""
          echo "Docker:"
          docker --version

          echo ""
          echo "Terraform:"
          /usr/local/bin/terraform version

          echo ""
          echo "Terraform PATH:"
          command -v terraform || true

          echo ""
          echo "Python:"
          python3 --version

          echo ""
          echo "Pip:"
          python3 -m pip --version


      # ========================================================
      # INSTALL GITLEAKS
      # ========================================================

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITLEAKS_VERSION}"

          echo "=========================================="
          echo "Installing Gitleaks ${VERSION}"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz

          tar \
            -xzf \
            /tmp/gitleaks.tar.gz \
            -C /tmp

          sudo install \
            -m 0755 \
            /tmp/gitleaks \
            /usr/local/bin/gitleaks

          gitleaks version


      # ========================================================
      # GITLEAKS SCAN
      # ========================================================

      - name: Run Gitleaks secret detection
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Gitleaks Secret Detection"
          echo "=========================================="

          gitleaks git \
            --redact \
            --verbose


      # ========================================================
      # INSTALL TRIVY
      # ========================================================

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TRIVY_VERSION}"

          echo "=========================================="
          echo "Installing Trivy ${VERSION}"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            --output /tmp/trivy.tar.gz

          tar \
            -xzf \
            /tmp/trivy.tar.gz \
            -C /tmp

          sudo install \
            -m 0755 \
            /tmp/trivy \
            /usr/local/bin/trivy

          trivy --version


      # ========================================================
      # TRIVY IaC SCAN
      # ========================================================

      - name: Run Trivy IaC scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Trivy IaC Security Scan"
          echo "=========================================="

          trivy config \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            .


      # ========================================================
      # INSTALL CHECKOV
      # ========================================================

      - name: Install Checkov
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing Checkov"
          echo "=========================================="

          python3 -m pip install \
            --upgrade \
            pip \
            --break-system-packages

          python3 -m pip install \
            --upgrade \
            checkov \
            --break-system-packages

          checkov --version


      # ========================================================
      # CHECKOV SCAN
      # ========================================================

      - name: Run Checkov Terraform scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checkov Terraform Security Scan"
          echo "=========================================="

          checkov \
            --directory ./terraform \
            --framework terraform \
            --output cli \
            --soft-fail false


      # ========================================================
      # TERRAFORM INIT
      # ========================================================

      - name: Terraform Init
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/local/bin:${PATH}"

          terraform init \
            -input=false


      # ========================================================
      # TERRAFORM VALIDATE
      # ========================================================

      - name: Terraform Validate
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/local/bin:${PATH}"

          terraform validate


      # ========================================================
      # TERRAFORM PLAN
      # ========================================================

      - name: Terraform Plan
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/local/bin:${PATH}"

          terraform plan \
            -input=false \
            -out=tfplan.binary

          terraform show \
            -json \
            tfplan.binary \
            > tfplan.json


      # ========================================================
      # INSTALL OPA
      # ========================================================

      - name: Install OPA
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${OPA_VERSION}"

          echo "=========================================="
          echo "Installing OPA ${VERSION}"
          echo "=========================================="

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://openpolicyagent.org/downloads/v${VERSION}/opa_linux_amd64_static" \
            --output /tmp/opa

          sudo install \
            -m 0755 \
            /tmp/opa \
            /usr/local/bin/opa

          opa version


      # ========================================================
      # OPA CHECK
      # ========================================================

      - name: Validate OPA policies
        shell: bash
        run: |
          set -euo pipefail

          opa check \
            policies/opa


      # ========================================================
      # OPA TERRAFORM POLICY
      # ========================================================

      - name: Run OPA Terraform policy
        shell: bash
        run: |
          set -euo pipefail

          opa eval \
            --fail \
            --input terraform/tfplan.json \
            --data policies/opa/s3_kms_enforcement.rego \
            'data.terraform.analysis.deny'


      # ========================================================
      # DOCKER BUILD
      # ========================================================

      - name: Build sample application
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building sample application"
          echo "=========================================="

          docker build \
            --tag sample-app:latest \
            ./app

          docker images sample-app


      # ========================================================
      # TRIVY CONTAINER SCAN
      # ========================================================

      - name: Run Trivy container vulnerability scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Trivy Container Security Scan"
          echo "=========================================="

          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            sample-app:latest


  # ============================================================
  # LOCAL DEPLOYMENT
  # ============================================================

  local-deployment:

    name: Local Deployment to Floci

    runs-on: ubuntu-latest

    needs:
      - security-scans

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Initializing repository"
          echo "=========================================="

          git init .

          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch \
            --no-tags \
            --prune \
            origin \
            "${GITHUB_SHA}"

          git checkout \
            --force \
            "${GITHUB_SHA}"

          git remote remove origin

          echo ""
          echo "Repository checkout completed."

          git rev-parse HEAD


      # ========================================================
      # INSTALL SYSTEM PACKAGES
      # ========================================================

      - name: Install required system packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install \
            --yes \
            unzip \
            curl \
            jq


      # ========================================================
      # INSTALL TERRAFORM
      # ========================================================

      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TERRAFORM_VERSION}"

          echo "=========================================="
          echo "Installing Terraform ${VERSION}"
          echo "=========================================="

          WORK_DIR="$(mktemp -d)"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_linux_amd64.zip" \
            --output "${WORK_DIR}/terraform.zip"

          unzip \
            -o \
            "${WORK_DIR}/terraform.zip" \
            -d "${WORK_DIR}"

          sudo install \
            -m 0755 \
            "${WORK_DIR}/terraform" \
            /usr/local/bin/terraform

          echo ""
          echo "Terraform:"
          /usr/local/bin/terraform version

          echo ""
          echo "Terraform path:"
          command -v terraform || true


      # ========================================================
      # VERIFY TERRAFORM
      # ========================================================

      - name: Verify Terraform
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/local/bin:${PATH}"

          if [ ! -x /usr/local/bin/terraform ]; then
            echo "ERROR: Terraform was not installed."
            exit 1
          fi

          echo "Terraform binary:"
          ls -lh /usr/local/bin/terraform

          echo ""
          echo "Terraform version:"
          /usr/local/bin/terraform version


      # ========================================================
      # DOCKER CHECK
      # ========================================================

      - name: Check Docker
        shell: bash
        run: |
          set -euo pipefail

          docker version

          echo ""
          docker info


      # ========================================================
      # FLOCI IMAGE
      # ========================================================

      - name: Pull Floci image
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Pulling Floci"
          echo "=========================================="

          for attempt in 1 2 3 4 5; do

            echo "Pull attempt ${attempt}/5..."

            if docker pull "${FLOCI_IMAGE}"; then
              echo "Floci image pulled successfully."
              exit 0
            fi

            echo "Pull failed."

            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 5))
            fi

          done

          echo "ERROR: Unable to pull Floci image."

          docker info

          exit 1


      # ========================================================
      # START FLOCI
      # ========================================================

      - name: Start Floci
        shell: bash
        run: |
          set -euo pipefail

          docker rm \
            --force \
            floci 2>/dev/null || true

          docker run \
            --detach \
            --name floci \
            --publish 4566:4566 \
            "${FLOCI_IMAGE}"

          echo ""
          echo "Floci started."

          docker ps -a


      # ========================================================
      # FLOCI LOGS
      # ========================================================

      - name: Check Floci container
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Floci Container"
          echo "=========================================="

          docker ps -a

          echo ""
          echo "Floci logs:"

          docker logs floci || true


      # ========================================================
      # FLOCI READINESS
      # ========================================================

      - name: Wait for Floci
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Waiting for Floci"
          echo "=========================================="

          for attempt in {1..30}; do

            echo "Health check ${attempt}/30..."

            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 5 \
              http://localhost:4566/ \
              >/dev/null 2>&1; then

              echo "Floci is ready."

              exit 0

            fi

            sleep 2

          done

          echo "ERROR: Floci did not become ready."

          docker ps -a

          echo ""
          docker logs floci || true

          exit 1


      # ========================================================
      # TERRAFORM INIT
      # ========================================================

      - name: Terraform Init
        working-directory: ./terraform
        env:
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/local/bin:${PATH}"

          terraform init \
            -input=false


      # ========================================================
      # TERRAFORM VALIDATE
      # ========================================================

      - name: Terraform Validate
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/local/bin:${PATH}"

          terraform validate


      # ========================================================
      # TERRAFORM APPLY
      # ========================================================

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/usr/local/bin:${PATH}"

          echo "=========================================="
          echo "Terraform Apply"
          echo "=========================================="

          terraform apply \
            -input=false \
            -auto-approve


  # ============================================================
  # FAILURE NOTIFICATION
  # ============================================================

  notify-on-failure:

    name: Slack Failure Notification

    runs-on: ubuntu-latest

    needs:
      - security-scans
      - local-deployment

    if: >-
      always() &&
      (
        needs.security-scans.result == 'failure' ||
        needs.local-deployment.result == 'failure'
      )

    steps:

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured."
            exit 0
          fi

          MESSAGE="🚨 DevSecOps Security Gate failed
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(jq \
            -n \
            --arg text "$MESSAGE" \
            '{text: $text}')

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${SLACK_WEBHOOK_URL}"