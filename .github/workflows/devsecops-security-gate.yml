# =============================================================================
# GitHub Actions Workflow: DevSecOps Security Gate
# =============================================================================
#
# Pipeline:
#   1. Checkout
#   2. Environment validation
#   3. Gitleaks secret detection
#   4. Trivy Terraform IaC scan
#   5. Checkov Terraform policy scan
#   6. Terraform format validation
#   7. Terraform initialization
#   8. Terraform validation
#   9. Terraform plan
#  10. OPA/Rego policy validation
#  11. Local Floci deployment
#  12. Deployment verification
#  13. Rollback on deployment failure
#
# Security principle:
#   Security failures block deployment.
#
# =============================================================================

name: DevSecOps Security Gate

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

# -----------------------------------------------------------------------------
# Global permissions
# -----------------------------------------------------------------------------

permissions:
  contents: read

# -----------------------------------------------------------------------------
# Security Scan Job
# -----------------------------------------------------------------------------

jobs:

  security-scans:

    name: Security Scans

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # =======================================================================
      # 1. Checkout
      # =======================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =======================================================================
      # 2. Environment
      # =======================================================================

      - name: Check environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Environment"
          echo "=========================================="

          echo
          echo "Runner:"
          uname -a

          echo
          echo "Git:"
          git --version

          echo
          echo "Docker:"
          docker --version

      # =======================================================================
      # 3. Gitleaks
      # =======================================================================

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =======================================================================
      # 4. Install Terraform
      # =======================================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Verify Terraform
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform"
          echo "=========================================="

          terraform version

      # =======================================================================
      # 5. Install Trivy
      # =======================================================================

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing Trivy"
          echo "=========================================="

          TRIVY_VERSION="0.72.0"

          curl -sfL \
            "https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh" \
            | sh -s -- -b "${RUNNER_TEMP}" "v${TRIVY_VERSION}"

          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

          "${RUNNER_TEMP}/trivy" --version

      # =======================================================================
      # 6. Trivy Terraform IaC Scan
      # =======================================================================

      - name: Run Trivy Terraform IaC scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Trivy IaC Security Scan"
          echo "=========================================="

          echo "Scanning Terraform directory:"
          echo "./terraform"

          trivy config ./terraform \
            --severity HIGH,CRITICAL \
            --format table \
            --timeout 15m \
            --exit-code 1

      # =======================================================================
      # 7. Install Checkov
      # =======================================================================

      - name: Install Checkov
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing Checkov"
          echo "=========================================="

          python3 -m pip install --upgrade pip
          python3 -m pip install checkov

          checkov --version

      # =======================================================================
      # 8. Checkov Terraform Scan
      # =======================================================================

      - name: Run Checkov Terraform scan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checkov Terraform Security Scan"
          echo "=========================================="

          checkov \
            --directory ./terraform \
            --framework terraform \
            --output cli 

      # =======================================================================
      # 9. Terraform Format Check
      # =======================================================================

      - name: Terraform format check
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Format Check"
          echo "=========================================="

          terraform -chdir=terraform fmt -recursive

      # =======================================================================
      # 10. Terraform Init
      # =======================================================================

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Init"
          echo "=========================================="

          terraform -chdir=terraform init -backend=false

      # =======================================================================
      # 11. Terraform Validate
      # =======================================================================

      - name: Terraform validate
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Validate"
          echo "=========================================="

          terraform -chdir=terraform validate

      # =======================================================================
      # 12. Terraform Plan
      # =======================================================================

      - name: Terraform plan
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Plan"
          echo "=========================================="

          terraform -chdir=terraform plan \
            -input=false \
            -lock=false \
            -out=tfplan.binary

      # =======================================================================
      # 13. Convert Terraform Plan to JSON
      # =======================================================================

      - name: Convert Terraform plan to JSON
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Plan JSON"
          echo "=========================================="

          terraform -chdir=terraform show \
            -json \
            tfplan.binary \
            > terraform/tfplan.json

      # =======================================================================
      # 14. Install OPA
      # =======================================================================

      - name: Install OPA
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing OPA"
          echo "=========================================="

          OPA_VERSION="1.8.0"

          curl -fsSL \
            -o "${RUNNER_TEMP}/opa" \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"

          chmod +x "${RUNNER_TEMP}/opa"

          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

          "${RUNNER_TEMP}/opa" version

      # =======================================================================
      # 15. Validate OPA Policy Files
      # =======================================================================

      - name: Validate OPA policies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OPA Policy Validation"
          echo "=========================================="

          if [ ! -d "./policies/opa" ]; then
            echo "OPA policy directory not found."
            exit 1
          fi

          opa check ./policies/opa

      # =======================================================================
      # 16. Run OPA against Terraform Plan
      # =======================================================================

      - name: Run OPA Terraform policy
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OPA Terraform Security Policy"
          echo "=========================================="

          if [ ! -f "./policies/opa/s3_kms_enforcement.rego" ]; then
            echo "OPA policy file not found:"
            echo "./policies/opa/s3_kms_enforcement.rego"
            exit 1
          fi

          # Evaluate policy and parse result without failing on empty set
          OPA_OUTPUT=$(opa eval \
            --input ./terraform/tfplan.json \
            --data ./policies/opa/s3_kms_enforcement.rego \
            'data.terraform.analysis.deny')

          echo "$OPA_OUTPUT"

          # Extract violations array
          VIOLATIONS=$(echo "$OPA_OUTPUT" | jq -r '.result[0].expressions[0].value')

          # Fail step only if violations exist
          if [ "$VIOLATIONS" != "[]" ] && [ "$VIOLATIONS" != "null" ]; then
            echo "OPA Security Policy Violation(s) Detected!"
            exit 1
          fi

          echo "OPA Security Policy Passed successfully!"

      # =======================================================================
      # 17. Upload Terraform Plan
      # =======================================================================

      - name: Upload Terraform plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            terraform/tfplan.binary
            terraform/tfplan.json
          if-no-files-found: warn

      # =======================================================================
      # 18. Security Summary
      # =======================================================================

      - name: Security scan summary
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "SECURITY GATE PASSED"
          echo "=========================================="
          echo
          echo "Gitleaks       : PASSED"
          echo "Trivy IaC      : PASSED"
          echo "Checkov        : PASSED"
          echo "Terraform fmt  : PASSED"
          echo "Terraform init : PASSED"
          echo "Terraform      : PASSED"
          echo "OPA/Rego       : PASSED"
          echo
          echo "Deployment may proceed."

  # ===========================================================================
  # Local Floci Deployment
  # ===========================================================================

  local-deployment:

    name: Local Floci Deployment

    runs-on: ubuntu-latest

    needs:
      - security-scans

    timeout-minutes: 30

    services:

      floci:
        image: floci/floci:latest

        ports:
          - 4566:4566

    steps:

      # =======================================================================
      # 1. Checkout
      # =======================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =======================================================================
      # 2. Verify Floci
      # =======================================================================

      - name: Verify Floci availability
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking Floci"
          echo "=========================================="

          for i in {1..30}; do

            if curl -fsS http://localhost:4566/_localstack/health >/dev/null 2>&1; then
              echo "Floci endpoint is available."
              exit 0
            fi

            echo "Waiting for Floci..."
            sleep 2

          done

          echo "Floci did not become available."
          exit 1

      # =======================================================================
      # 3. Setup Terraform
      # =======================================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Verify Terraform
        shell: bash
        run: terraform version

      # =======================================================================
      # 4. Terraform Init
      # =======================================================================

      - name: Terraform init
        shell: bash
        working-directory: ./terraform
        env:
          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566
        run: |
          set -euo pipefail

          terraform init -backend=false

      # =======================================================================
      # 5. Terraform Apply
      # =======================================================================

      - name: Terraform apply
        id: terraform_apply
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Terraform Apply"
          echo "=========================================="

          terraform apply \
            -auto-approve \
            -input=false

      # =======================================================================
      # 6. Deployment Verification
      # =======================================================================

      - name: Verify deployment
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Deployment Verification"
          echo "=========================================="

          terraform -chdir=terraform output || true

          echo
          echo "Floci deployment completed successfully."

      # =======================================================================
      # 7. Rollback if Apply Fails
      # =======================================================================

      - name: Rollback Terraform deployment
        if: failure()
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

          AWS_ENDPOINT_URL_S3: http://localhost:4566
          AWS_ENDPOINT_URL_KMS: http://localhost:4566
          AWS_ENDPOINT_URL_SECRETSMANAGER: http://localhost:4566
          AWS_ENDPOINT_URL_IAM: http://localhost:4566
          AWS_ENDPOINT_URL_STS: http://localhost:4566

        run: |
          set +e

          echo "=========================================="
          echo "ROLLBACK"
          echo "=========================================="

          terraform destroy \
            -auto-approve \
            -input=false

          ROLLBACK_EXIT_CODE=$?

          if [ "${ROLLBACK_EXIT_CODE}" -eq 0 ]; then
            echo "Rollback completed successfully."
          else
            echo "Rollback encountered errors."
          fi

          exit 0

      # =======================================================================
      # 8. Deployment Summary
      # =======================================================================

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "DEPLOYMENT PASSED"
          echo "=========================================="
          echo
          echo "Security gate : PASSED"
          echo "Terraform     : APPLIED"
          echo "Floci         : AVAILABLE"
          echo "Verification  : PASSED"
          echo
          echo "DevSecOps pipeline completed successfully."